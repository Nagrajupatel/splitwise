server.port=8080

# H2 file database (data survives restarts). Swap for PostgreSQL/MySQL later if you like.
spring.datasource.url=jdbc:h2:file:./data/splitwise;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Folder containing eng.traineddata (see README)
ocr.tessdata-path=./tessdata
